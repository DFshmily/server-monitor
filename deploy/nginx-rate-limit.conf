# Nginx 认证接口限流配置（参考模板）
#
# 部署方式：
#   1. 将本文件的 limit_req_zone 放入 /etc/nginx/conf.d/rate-limit.conf（http 上下文）
#   2. 在站点配置的 server 块中加入下面的 location /api/auth/ 覆盖块
#   3. nginx -t && systemctl reload nginx
#
# 效果：认证接口（登录/注册/验证码）每 IP 2 req/s，突发容忍 5，
#       与应用层锁定（邮箱 5 次/15 分钟、IP 10 次/15 分钟）形成双保险。

# ── http 上下文 ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

